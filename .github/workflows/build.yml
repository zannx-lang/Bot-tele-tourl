name: Build
on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      tag:
        required: true
        type: string
      build_type:
        required: false
        default: release
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source ZIP
        run: |
          curl -L --fail --retry 3 "${{ inputs.zip_url }}" -o source.zip
          rm -rf source
          mkdir source
          unzip -q source.zip -d source
      - name: Package build output
        run: |
          mkdir -p output
          cd source
          zip -qr ../output/source-${{ inputs.tag }}.zip .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.tag }}
          path: output/*
